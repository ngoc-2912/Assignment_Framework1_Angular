<nav class="navbar navbar-expand-lg navbar-light sticky-top site-navbar bg-white shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" routerLink="/">
      <img src="/logo.png" alt="SmartNest" height="40" />
    </a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#mainNavbar"
      aria-controls="mainNavbar"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div id="mainNavbar" class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-lg-2">
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            Trang chủ
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/shop" routerLinkActive="active">Cửa hàng</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/about" routerLinkActive="active">Về chúng tôi</a>
        </li>
      </ul>

      <div class="d-flex flex-column flex-lg-row align-items-lg-center gap-2">
        <a class="btn btn-outline-dark position-relative" routerLink="/cart">
          <i class="bi bi-cart3 me-1"></i> Giỏ hàng
          <span
            class="position-absolute top-0 start-100 translate-middle badge rounded-pill text-bg-danger"
          >
          </span>
        </a>

        @if (isLoggedIn()) {
          <div class="dropdown">
            <button
              class="btn btn-outline-dark dropdown-toggle"
              type="button"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
              Chào {{ fullName() || 'bạn' }}
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li>
                <a class="dropdown-item" routerLink="/profile">Thông tin tài khoản</a>
              </li>
              @if (isAdmin()) {
                <li>
                  <a class="dropdown-item" routerLink="/admin">Trang admin</a>
                </li>
              }
              <li><hr class="dropdown-divider" /></li>
              <li>
                <button class="dropdown-item text-danger" type="button" (click)="logout()">
                  Đăng xuất
                </button>
              </li>
            </ul>
          </div>
        } @else {
          <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary" routerLink="/login">Đăng nhập</a>
            <a class="btn btn-dark" routerLink="/register">Đăng ký</a>
          </div>
        }
      </div>
    </div>
  </div>
</nav>
