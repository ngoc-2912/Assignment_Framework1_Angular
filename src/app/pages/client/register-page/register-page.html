<section class="auth-shell mx-auto">
  <div class="card border-0 shadow-sm">
    <div class="card-body p-4 p-lg-5">
      <h1 class="h3 fw-bold mb-2">Tạo tài khoản mới</h1>
      <p class="text-secondary mb-4">
        Trở thành thành viên để nhận giá ưu đãi và cập nhật sản phẩm mới sớm nhất.
      </p>

      <form [formGroup]="registerForm" (ngSubmit)="register()">
        <div class="mb-3">
          <label class="form-label">Họ và tên</label>
          <input class="form-control" formControlName="full_name" type="text" placeholder="Vui lòng nhập vào tên."/>
        </div>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input class="form-control" formControlName="email" type="email" placeholder="Vui lòng nhập vào email."/>
        </div>

        <div class="mb-3">
          <label class="form-label">Mật khẩu</label>
          <input class="form-control" formControlName="password" type="password" placeholder="Vui lòng nhập vào mật khẩu."/>
        </div>
        <div class="form-check mb-4">
          <input id="agree" class="form-check-input" type="checkbox" required/>
          <label for="agree" class="form-check-label"
            >Tôi đồng ý với điều khoản sử dụng và chính sách bảo mật.</label
          >
        </div>

        <button class="btn btn-dark w-100" type="submit">Đăng ký</button>
      </form>

      <p class="text-danger mt-3">{{ errorMessage() }}</p>

      <p class="mt-4 mb-0 text-secondary">
        Đã có tài khoản?
        <a routerLink="/login" class="fw-semibold">Đăng nhập</a>
      </p>
    </div>
  </div>
</section>
