<div class="row g-4 mb-4">
  <div class="col-md-3">
    <div class="card dashboard-card card-blue">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <h6 class="text-uppercase mb-2">Khách hàng</h6>
            <h2 class="fw-bold mb-0">{{totalUsers}}</h2>
          </div>
          <div class="icon-shape bg-white text-primary rounded-circle">
            <i class="bi bi-people-fill"></i>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <div class="col-md-3">
    <div class="card dashboard-card card-green">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <h6 class="text-uppercase mb-2">Sản phẩm</h6>
            <h2 class="fw-bold mb-0">{{totalProducts}}</h2>
          </div>
          <div class="icon-shape bg-white text-success rounded-circle">
            <i class="bi bi-box-seam"></i>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="col-md-3">
    <div class="card dashboard-card card-orange">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <h6 class="text-uppercase mb-2">Đơn hàng</h6>
            <h2 class="fw-bold mb-0">{{totalOrders}}</h2>
          </div>
          <div class="icon-shape bg-white text-warning rounded-circle">
            <i class="bi bi-cart-check"></i>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="col-md-3">
    <div class="card dashboard-card card-purple">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <h6 class="text-uppercase mb-2">Doanh thu</h6>
            <h2 class="fw-bold mb-0">{{totalRevenue | currency:'VND':'symbol':'1.0-0'}}</h2>
          </div>
          <div class="icon-shape bg-white text-info rounded-circle">
            <i class="bi bi-currency-dollar"></i>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="row g-4">
  <div class="col-md-8">
    <div class="card chart-card shadow-sm">
      <div class="card-header bg-transparent border-0 pt-3">
        <h5 class="fw-bold text-dark">Biến động doanh thu</h5>
      </div>
      <div class="card-body">
        <canvas #revenueCanvas height="250"></canvas>
      </div>
    </div>
  </div>

  <div class="col-md-4">
    <div class="card chart-card shadow-sm">
      <div class="card-header bg-transparent border-0 pt-3">
        <h5 class="fw-bold text-dark">Trạng thái đơn hàng</h5>
      </div>
      <div class="card-body d-flex justify-content-center">
        <canvas #statusCanvas height="250"></canvas>
      </div>
    </div>
  </div>
</div>
